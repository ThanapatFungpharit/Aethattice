[package]
name = "cs-qa-tests"
description = "Independent QA black-box tests written from the specification and frozen contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The library target is empty: everything lives in tests/. See src/lib.rs for how to run.

[features]
default = []
# Bind the suite to the real M0 crates (cs-common, cs-db, cs-crypto, cs-ops, cs-kms, cs-api, cs binary).
# OFF by default: until the M0 implementations are merged the bindings in
# tests/support/contract.rs cannot compile.
m0-contract = []
# QA self-check: compiles the suite against a stub adapter (tests/support/contract_stub.rs) so that the
# test logic itself is type-checked and linted before the implementations exist. Tests that need the
# implementation panic with "QA stub" when run this way. Never enable together with m0-contract in CI.
qa-selfcheck = []
# M1 identity suite (tests/m1/): binds to cs-identity public APIs and the `cs` binary. Implies the
# M0 adapter (support/contract.rs), which it reuses for the binary harness.
m1-contract = ["m0-contract"]

[dependencies]

[dev-dependencies]
# Crates under test (contract-specified public API names; see docs/contracts/M0-foundations.md).
cs-common = { path = "../cs-common" }
cs-db = { path = "../cs-db" }
cs-crypto = { path = "../cs-crypto" }
cs-ops = { path = "../cs-ops" }
cs-kms = { path = "../cs-kms" }
cs-api = { path = "../cs-api" }
cs-identity = { path = "../cs-identity" }
cs-identity-wire = { path = "../cs-identity-wire" }
# Test tooling only.
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "process", "net", "sync", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
proptest = "1.12"
uuid = { version = "1.29", features = ["v4", "v7"] }
hex = "0.4"
base64 = "0.22"
tempfile = "3.27"
futures = "0.3"
# Used only by the adapter (support/contract.rs) to call the HTTP-layer extractors and to build
# serde payloads for the outbox.
serde = { workspace = true }
axum = { workspace = true }
# M1 suite (tests/m1): OPAQUE client, DPoP proofs, software authenticator, log capture.
rand_core_06 = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
ciborium = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }

[lints]
workspace = true
