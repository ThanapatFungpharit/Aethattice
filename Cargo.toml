[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.94"

[workspace.dependencies]
# internal
cs-common = { path = "crates/cs-common" }
cs-crypto = { path = "crates/cs-crypto" }
cs-kms = { path = "crates/cs-kms" }
cs-db = { path = "crates/cs-db" }
cs-ops = { path = "crates/cs-ops" }
cs-api = { path = "crates/cs-api" }
# external (pinned minor versions; Cargo.lock pins exact versions)
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri", "matched-path"] }
base64 = "0.22.1"
blake3 = "1.8.7"
bytes = "1.10.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
futures = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
http = "1.4.2"
http-body-util = "0.1.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["catch-panic", "limit"] }
tracing = "0.1.41"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt", "registry"] }
uuid = { version = "1.29.2", default-features = false, features = ["std", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
serde_jcs = "0.2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
